[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-retention-pipeline"
version = "0.1.0"
description = "A reproducible customer retention modeling pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.4,<2.0",
    "xgboost>=2.0,<4.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "shap>=0.45,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "jupyter>=1,<2",
    "nbconvert>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
