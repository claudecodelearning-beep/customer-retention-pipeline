name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-py310.txt
      - name: Install project and reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-py310.txt -e ".[dev]"
          python -m pip check
      - name: Unit tests and prediction CLI smoke test
        run: python -m pytest -q
      - name: Check command-line entry points
        run: |
          python -m churn_pipeline.train --help
          python -m churn_pipeline.predict --help
